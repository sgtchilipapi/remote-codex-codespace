<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<title>Codex Relay</title>
<link rel="stylesheet" href="/styles.css">
<main id="app-shell">
  <header>
    <h1>Codex Relay</h1>
    <button id="new" type="button">New</button>
    <button id="resume" type="button">Resume</button>
    <button id="configure" type="button">Configure</button>
    <button id="settings-trigger" class="icon-button" type="button" aria-label="Settings" title="Settings">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path>
      </svg>
    </button>
  </header>

  <section id="settings" aria-labelledby="settings-heading" hidden>
    <h2 id="settings-heading" tabindex="-1">Settings</h2>
    <p id="settings-error" role="alert" tabindex="-1" hidden></p>
    <div class="field">
      <label for="token">API token</label>
      <input id="token" type="password" autocomplete="current-password" aria-describedby="token-error">
      <span id="token-error" class="field-error"></span>
    </div>
    <p id="settings-progress" role="status" aria-live="polite" hidden></p>
    <div class="configuration-actions">
      <button id="cancel-settings" type="button">Cancel</button>
      <button id="apply-settings" type="button">Save and connect</button>
    </div>
  </section>

  <section id="resume-picker" aria-labelledby="resume-heading" hidden>
    <div class="resume-heading-row">
      <h2 id="resume-heading" tabindex="-1">Resume a Thread</h2>
      <button id="cancel-resume" type="button">Cancel</button>
    </div>
    <p id="resume-status" role="status" aria-live="polite"></p>
    <p id="resume-error" role="alert" tabindex="-1" hidden></p>
    <div id="resume-results"></div>
    <button id="load-more-threads" type="button" hidden>Load more</button>
  </section>

  <section id="configuration" aria-labelledby="configuration-heading" hidden>
    <h2 id="configuration-heading" tabindex="-1">Configuration</h2>
    <p id="configuration-error" role="alert" tabindex="-1" hidden></p>
    <div class="configuration-grid">
      <div class="field">
        <label for="model">Model</label>
        <select id="model" aria-describedby="model-hint model-error" disabled><option value="">Default</option></select>
        <span id="model-hint" class="field-hint">Apply an API token to load models.</span>
        <span id="model-error" class="field-error"></span>
      </div>
      <div class="field">
        <label for="reasoning">Reasoning effort</label>
        <select id="reasoning" aria-describedby="reasoning-hint reasoning-error" disabled><option value="">Default</option></select>
        <span id="reasoning-hint" class="field-hint">Apply an API token to load reasoning efforts.</span>
        <span id="reasoning-error" class="field-error"></span>
      </div>
      <div class="field">
        <label for="permissions">Permissions</label>
        <select id="permissions" aria-describedby="permissions-error"><option value="">Default</option></select>
        <span id="permissions-error" class="field-error"></span>
      </div>
      <div class="field">
        <label for="fast-mode">Fast mode</label>
        <select id="fast-mode" aria-describedby="fast-mode-hint fast-mode-error">
          <option value="">Default</option>
          <option value="on">On</option>
          <option value="off">Off</option>
        </select>
        <span id="fast-mode-hint" class="field-hint">Availability follows the selected model.</span>
        <span id="fast-mode-error" class="field-error"></span>
      </div>
    </div>
    <p id="configuration-progress" role="status" aria-live="polite" hidden></p>
    <div class="configuration-actions">
      <button id="cancel-configuration" type="button">Cancel</button>
      <button id="apply-configuration" type="button">Apply and close</button>
    </div>
  </section>

  <div id="messages" aria-label="Thread messages">
    <button id="load-older-history" type="button" hidden>Retry loading older history</button>
  </div>
  <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
  <form id="composer">
    <label class="visually-hidden" for="prompt">Prompt</label>
    <textarea id="prompt" rows="1" placeholder="Ask Codex…" required></textarea>
    <button id="send">Send</button>
    <button id="show-status" class="icon-button" type="button" aria-label="Show status" title="Show status">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5"></path>
        <path d="M12 8h.01"></path>
      </svg>
    </button>
  </form>
</main>
<script src="/client.js"></script>
</html>
