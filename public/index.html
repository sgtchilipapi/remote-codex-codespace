<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<title>Codex Relay</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111827; color: #e5e7eb; font: 16px system-ui; }
  main { max-width: 720px; min-height: 100dvh; margin: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  header, form, nav { display: flex; gap: 8px; }
  header { align-items: center; flex-wrap: wrap; }
  nav { width: 100%; }
  h1 { margin: 0; font-size: 18px; flex: 1; }
  #messages { flex: 1; overflow-wrap: anywhere; white-space: pre-wrap; }
  .message { padding: 12px; margin: 8px 0; border-radius: 10px; background: #1f2937; }
  .user { background: #1d4ed8; }
  input, textarea, button { font: inherit; border: 0; border-radius: 8px; padding: 10px; }
  input, textarea { color: #111827; background: white; }
  #token { width: 150px; }
  #model { min-width: 0; flex: 1; }
  textarea { flex: 1; resize: none; }
  button { background: #e5e7eb; color: #111827; }
  button:disabled { opacity: .5; }
  #status { color: #9ca3af; min-height: 1.2em; }
</style>
<main>
  <header>
    <h1>Codex Relay</h1>
    <input id="token" type="password" placeholder="API token" aria-label="API token">
    <nav>
      <button id="new" type="button">New</button>
      <button id="show-status" type="button">Status</button>
      <select id="model" aria-label="Model">
        <option value="">Load models</option>
      </select>
      <select id="reasoning" aria-label="Reasoning">
        <option value="">Default reasoning</option>
      </select>
      <select id="permissions" aria-label="Permissions">
        <option value="">Default permissions</option>
        <option value="read-only">read only</option>
        <option value="workspace-write">workspace write</option>
      </select>
    </nav>
  </header>
  <div id="messages"></div>
  <div id="status"></div>
  <form>
    <textarea id="prompt" rows="3" placeholder="Ask Codex…" required></textarea>
    <button id="send">Send</button>
  </form>
</main>
<script>
  const token = document.querySelector("#token");
  const messages = document.querySelector("#messages");
  const status = document.querySelector("#status");
  const form = document.querySelector("form");
  const prompt = document.querySelector("#prompt");
  const send = document.querySelector("#send");
  const newButton = document.querySelector("#new");
  const model = document.querySelector("#model");
  const reasoning = document.querySelector("#reasoning");
  const permissions = document.querySelector("#permissions");
  let state = JSON.parse(localStorage.getItem("relay") || '{"threadId":null,"messages":[],"activeTurn":null}');
  state.activeTurn ||= null;
  token.value = localStorage.getItem("token") || "";
  let info;
  let followingTurn = false;
  permissions.value = localStorage.getItem("permissions") || "";

  function save() { localStorage.setItem("relay", JSON.stringify(state)); }
  function draw() {
    messages.replaceChildren(...state.messages.map(({ role, text }) => {
      const node = document.createElement("div");
      node.className = `message ${role}`;
      node.textContent = text;
      return node;
    }));
    const working = Boolean(state.activeTurn);
    send.disabled = working;
    newButton.disabled = working;
    window.scrollTo(0, document.body.scrollHeight);
  }

  newButton.onclick = () => {
    if (state.activeTurn) return;
    state = { threadId: null, messages: [], activeTurn: null };
    save();
    draw();
  };

  async function loadInfo() {
    const response = await fetch("/info", { headers: { "Authorization": `Bearer ${token.value}` } });
    if (!response.ok) throw new Error((await response.json()).error);
    info = await response.json();
    const candidate = model.value || localStorage.getItem("model");
    const selected = info.models.some(({ id }) => id === candidate)
      ? candidate
      : info.models.find(({ isDefault }) => isDefault)?.id;
    model.replaceChildren(...info.models.map((item) => new Option(item.name, item.id)));
    model.value = selected;
    updateReasoning();
  }

  function updateReasoning() {
    const selected = info.models.find(({ id }) => id === model.value);
    const saved = localStorage.getItem("reasoning") || selected.defaultReasoning;
    reasoning.replaceChildren(...selected.reasoning.map((effort) => new Option(effort, effort)));
    reasoning.value = selected.reasoning.includes(saved) ? saved : selected.defaultReasoning;
  }

  model.onchange = () => {
    localStorage.setItem("model", model.value);
    updateReasoning();
    localStorage.setItem("reasoning", reasoning.value);
  };
  reasoning.onchange = () => localStorage.setItem("reasoning", reasoning.value);
  permissions.onchange = () => localStorage.setItem("permissions", permissions.value);
  token.onchange = () => loadInfo()
    .then(() => followActiveTurn())
    .catch((error) => { status.textContent = error.message; });

  document.querySelector("#show-status").onclick = async () => {
    status.textContent = "Loading status…";
    try { await loadInfo(); } catch (error) { status.textContent = error.message; return; }
    const limits = info.rateLimits;
    status.textContent = [
      `Thread: ${state.threadId || "new"}`,
      `Model: ${model.value}`,
      `Reasoning: ${reasoning.value}`,
      `Permissions: ${permissions.value || "default"}`,
      limits.primary && `5h: ${limits.primary.usedPercent}% used`,
      limits.secondary && `Weekly: ${limits.secondary.usedPercent}% used`,
      `Plan: ${limits.planType}`,
    ].filter(Boolean).join(" · ");
  };

  const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

  function stopUnavailableTurn(message) {
    const active = state.activeTurn;
    const assistant = state.messages[active.messageIndex];
    if (!assistant.text && active.error) assistant.text = `Error: ${active.error}`;
    state.activeTurn = null;
    status.textContent = message;
    save();
    draw();
  }

  function applyTurnEvent(event) {
    const active = state.activeTurn;
    if (!active || !Number.isInteger(event.sequence) || event.sequence <= active.lastSequence) return false;
    active.lastSequence = event.sequence;
    if (event.type === "thread.started") state.threadId = event.thread_id;
    if (event.type === "item.completed" && event.item?.type === "agent_message") {
      state.messages[active.messageIndex].text += event.item.text;
    }
    if (event.type === "error") active.error = event.message;
    if (event.type !== "relay.turn.finished") return false;

    if (event.status === "failed") {
      stopUnavailableTurn(active.error ? `Codex failed: ${active.error}` : "Codex failed");
    } else {
      state.activeTurn = null;
      status.textContent = "";
      save();
      draw();
    }
    return true;
  }

  async function responseError(response) {
    let message = `${response.status} ${response.statusText}`.trim();
    try { message = (await response.json()).error || message; } catch {}
    const error = new Error(message);
    error.retryable = response.status >= 500;
    return error;
  }

  async function followActiveTurn() {
    if (followingTurn || !state.activeTurn || !token.value) return;
    followingTurn = true;
    let retryDelay = 500;
    try {
      while (state.activeTurn) {
        try {
          const active = state.activeTurn;
          if (active.stage === "starting") {
            const response = await fetch("/turn", {
              method: "POST",
              headers: { "Authorization": `Bearer ${token.value}`, "Content-Type": "application/json" },
              body: JSON.stringify({ turnId: active.id, ...active.request }),
            });
            if (!response.ok) throw await responseError(response);
            active.stage = "streaming";
            save();
          }

          const response = await fetch(`/turn/${active.id}/events?after=${active.lastSequence}`, {
            headers: { "Authorization": `Bearer ${token.value}` },
          });
          if (!response.ok) throw await responseError(response);

          status.textContent = "Codex is working…";
          retryDelay = 500;
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          while (state.activeTurn) {
            const { value, done } = await reader.read();
            buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
            const lines = buffer.split("\n");
            buffer = lines.pop();
            for (const line of lines) {
              if (!line) continue;
              if (applyTurnEvent(JSON.parse(line))) return;
            }
            save();
            draw();
            if (done) throw new Error("Turn stream ended before completion");
          }
        } catch (error) {
          if (error.retryable === false) {
            stopUnavailableTurn(`Disconnected: ${error.message}`);
            return;
          }
          status.textContent = "Connection lost. Reconnecting…";
          save();
          draw();
          await wait(retryDelay);
          retryDelay = Math.min(retryDelay * 2, 10000);
        }
      }
    } finally {
      followingTurn = false;
    }
  }

  form.onsubmit = async (event) => {
    event.preventDefault();
    const text = prompt.value.trim();
    if (!text || state.activeTurn) return;
    localStorage.setItem("token", token.value);
    localStorage.setItem("model", model.value);
    localStorage.setItem("reasoning", reasoning.value);
    localStorage.setItem("permissions", permissions.value);
    state.messages.push({ role: "user", text }, { role: "assistant", text: "" });
    state.activeTurn = {
      id: crypto.randomUUID(),
      stage: "starting",
      lastSequence: 0,
      messageIndex: state.messages.length - 1,
      request: {
        prompt: text,
        threadId: state.threadId,
        model: model.value || undefined,
        reasoning: reasoning.value || undefined,
        permissions: permissions.value || undefined,
      },
    };
    prompt.value = "";
    status.textContent = "Codex is working…";
    save();
    draw();
    await followActiveTurn();
  };

  draw();
  if (token.value) {
    loadInfo().catch((error) => { status.textContent = error.message; });
    followActiveTurn();
  } else if (state.activeTurn) {
    status.textContent = "Enter the API token to reconnect to the active Turn";
  }
</script>
</html>
