<!doctype html>
<!-- THROWAWAY PROTOTYPE: Three compact Mobile Client layouts, switchable via ?variant=A|B|C. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compact Mobile Client prototype</title>
<style>
  :root { color-scheme: dark; font: 16px/1.4 system-ui, sans-serif; background:#111827; color:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; min-width:0; }
  button, input, select, textarea { font:inherit; }
  button, input, select { min-height:44px; }
  button { border:0; border-radius:10px; padding:10px 14px; background:#e5e7eb; color:#111827; font-weight:650; }
  button:disabled, select:disabled, input:disabled { opacity:.45; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid #fbbf24; outline-offset:2px; }
  .app { height:100dvh; max-width:720px; margin:auto; display:grid; overflow:hidden; background:#111827; }
  .topbar { display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; border-bottom:1px solid #374151; }
  h1 { margin:0; font-size:17px; flex:1; }
  .compact-button { padding-inline:11px; }
  .thread { min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:8px 12px 18px; }
  .message { max-width:92%; padding:11px 12px; margin:8px 0; border-radius:12px; background:#1f2937; overflow-wrap:anywhere; }
  .message.user { margin-left:auto; background:#1d4ed8; }
  .message pre { margin:8px 0 0; padding:8px; overflow-x:auto; white-space:pre; border-radius:7px; background:#0b1020; }
  .status { padding:6px 12px; color:#cbd5e1; font-size:13px; border-top:1px solid #374151; }
  .composer { display:flex; align-items:flex-end; gap:8px; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:#111827; border-top:1px solid #374151; }
  textarea { flex:1; min-width:0; min-height:46px; max-height:126px; resize:none; overflow:auto; border:0; border-radius:10px; padding:11px; color:#111827; background:white; }
  .config { background:#172033; }
  .config-fields { display:grid; gap:9px; padding:12px; }
  label { display:grid; gap:4px; color:#cbd5e1; font-size:13px; }
  input, select { width:100%; min-width:0; border:1px solid #4b5563; border-radius:9px; padding:8px 10px; color:#111827; background:#fff; }
  .config-actions { display:flex; gap:8px; }
  .config-actions button:first-child { flex:1; }
  .error { color:#fecaca; background:#7f1d1d; border-radius:8px; padding:8px; }
  .summary { color:#cbd5e1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chevron::after { content:' ▾'; }
  .streaming::after { content:' ●'; color:#60a5fa; animation:pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity:.25; } }
  @media (prefers-reduced-motion:reduce) { .streaming::after { animation:none; } }

  /* A: inline disclosure between top bar and Thread. */
  .variant-a { grid-template-rows:auto auto minmax(0,1fr) auto auto; }
  .variant-a .config { border-bottom:1px solid #374151; }
  .variant-a .config-fields { grid-template-columns:1fr 1fr; }
  .variant-a .config-fields label:first-child { grid-column:1/-1; }
  .variant-a .config-actions { grid-column:1/-1; }

  /* B: Configuration is a bottom sheet over an otherwise stable Thread. */
  .variant-b { grid-template-rows:auto minmax(0,1fr) auto auto; position:relative; }
  .variant-b .sheet-backdrop { position:absolute; inset:0; background:#0008; z-index:2; }
  .variant-b .config { position:absolute; z-index:3; inset:auto 0 0; max-height:min(78dvh,620px); overflow:auto; border-radius:18px 18px 0 0; padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -12px 32px #0008; }
  .variant-b .sheet-handle { width:44px; height:5px; border-radius:5px; margin:8px auto 0; background:#64748b; }
  .variant-b .config-title { margin:8px 12px 0; font-size:18px; }

  /* C: expanded Configuration replaces Thread temporarily. */
  .variant-c { grid-template-rows:auto minmax(0,1fr) auto auto; }
  .variant-c.config-open { grid-template-rows:auto minmax(0,1fr) auto; }
  .variant-c.config-open .config { overflow:auto; }
  .variant-c.config-open .thread, .variant-c.config-open .composer, .variant-c.config-open .status { display:none; }

  .prototype-controls { position:fixed; z-index:20; left:50%; bottom:max(10px,env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; align-items:center; gap:5px; max-width:calc(100vw - 16px); padding:5px; border:2px solid #fbbf24; border-radius:999px; background:#030712; box-shadow:0 8px 25px #000c; }
  .prototype-controls button { min-height:38px; padding:7px 11px; }
  .prototype-label { min-width:112px; text-align:center; font-size:12px; color:white; }
  .state-controls { position:fixed; z-index:19; right:8px; top:max(8px,env(safe-area-inset-top)); display:grid; gap:5px; padding:6px; border-radius:10px; background:#030712e8; box-shadow:0 5px 16px #0008; }
  .state-controls label { display:flex; align-items:center; gap:5px; font-size:11px; }
  .state-controls input { width:18px; min-height:18px; }
  .state-controls select { width:112px; min-height:34px; font-size:11px; padding:4px; }
  @media (max-height:520px) { .state-controls { grid-template-columns:repeat(2,auto); } .message { margin:5px 0; } }
</style>
<body>
<div id="root"></div>
<script>
  const variants = {
    A: 'Inline disclosure',
    B: 'Bottom sheet',
    C: 'Focus mode',
  };
  const params = new URLSearchParams(location.search);
  let variant = variants[params.get('variant')] ? params.get('variant') : 'A';
  let state = params.get('state') || 'configured';
  let open = params.get('open') === '1' || state === 'first-use' || state === 'error';

  function setQuery(next) {
    const query = new URLSearchParams(location.search);
    Object.entries(next).forEach(([key,value]) => query.set(key,value));
    history.replaceState(null,'',`?${query}`);
  }
  function configuration() {
    return `<section class="config" aria-label="Configuration panel">
      ${variant === 'B' ? '<div class="sheet-handle"></div><h2 class="config-title">Configuration</h2>' : ''}
      <div class="config-fields">
        <label>API token<input type="password" value="${state === 'first-use' ? '' : 'relay-token'}" placeholder="Required" ${state === 'streaming' ? 'disabled' : ''}></label>
        <label>Model<select ${state === 'streaming' ? 'disabled' : ''}><option>gpt-5.4</option></select></label>
        <label>Reasoning<select ${state === 'streaming' ? 'disabled' : ''}><option>medium</option></select></label>
        <label>Permissions<select ${state === 'streaming' ? 'disabled' : ''}><option>workspace write</option></select></label>
        ${state === 'error' ? '<div class="error" role="alert">That API token was rejected. Check it and try again.</div>' : ''}
        <div class="config-actions"><button data-action="apply" ${state === 'streaming' ? 'disabled' : ''}>Apply and close</button><button data-action="close" ${state === 'first-use' || state === 'error' ? 'disabled' : ''}>Cancel</button></div>
      </div>
    </section>`;
  }
  function thread() {
    return `<section class="thread" aria-label="Thread">
      <article class="message user">Make the Mobile Client work at 320px without changing its desktop character.</article>
      <article class="message">I’ll preserve the current hierarchy and move configuration out of the reading path.<pre><code>const viewport = window.visualViewport;</code></pre></article>
      <article class="message ${state === 'streaming' ? 'streaming' : ''}">${state === 'streaming' ? 'Working through the compact layout now' : 'The Thread stays readable while the composer remains immediately available.'}</article>
    </section>`;
  }
  function topbar() {
    return `<header class="topbar"><h1>Codex Relay</h1><button class="compact-button" data-action="new" ${state === 'streaming' ? 'disabled' : ''}>New</button><button class="compact-button" data-action="toggle" aria-expanded="${open}">${open ? 'Close' : 'Configure'}</button></header>`;
  }
  function composer() {
    return `<form class="composer"><label style="position:absolute;clip:rect(0 0 0 0)">Prompt</label><textarea placeholder="Ask Codex…" ${state === 'streaming' ? 'disabled' : ''}></textarea><button ${state === 'streaming' ? 'disabled' : ''}>Send</button></form>`;
  }
  function common() {
    return `${thread()}<div class="status" role="status">${state === 'streaming' ? 'Codex is working…' : 'Thread ready · gpt-5.4 · medium'}</div>${composer()}`;
  }
  function app() {
    let inside;
    if (variant === 'A') inside = `${topbar()}${open ? configuration() : ''}${common()}`;
    if (variant === 'B') inside = `${topbar()}${common()}${open ? `<div class="sheet-backdrop" data-action="close"></div>${configuration()}` : ''}`;
    if (variant === 'C') inside = `${topbar()}${open ? configuration() : ''}${common()}`;
    return `<main class="app variant-${variant.toLowerCase()} ${open ? 'config-open' : ''}">${inside}</main>`;
  }
  function chrome() {
    return `<aside class="state-controls" aria-label="Prototype state">
      <label>State <select id="state">${['first-use','configured','streaming','error'].map(x => `<option ${x===state?'selected':''}>${x}</option>`).join('')}</select></label>
      <label><input id="open" type="checkbox" ${open?'checked':''}> Configuration open</label>
    </aside>
    <nav class="prototype-controls" aria-label="Prototype variants"><button data-cycle="-1" aria-label="Previous variant">←</button><span class="prototype-label">${variant} · ${variants[variant]}</span><button data-cycle="1" aria-label="Next variant">→</button></nav>`;
  }
  function render() {
    document.querySelector('#root').innerHTML = app() + chrome();
    document.querySelector('#state').onchange = e => { state=e.target.value; open=state==='first-use'||state==='error'; setQuery({state,open:open?'1':'0'}); render(); };
    document.querySelector('#open').onchange = e => { open=e.target.checked; setQuery({open:open?'1':'0'}); render(); };
  }
  document.addEventListener('click', e => {
    const cycle=e.target.closest('[data-cycle]');
    if (cycle) { const keys=Object.keys(variants); variant=keys[(keys.indexOf(variant)+Number(cycle.dataset.cycle)+keys.length)%keys.length]; setQuery({variant}); render(); return; }
    const action=e.target.closest('[data-action]')?.dataset.action;
    if (action==='toggle') { open=!open; setQuery({open:open?'1':'0'}); render(); }
    if (action==='close'||action==='apply') { open=false; if(action==='apply') state='configured'; setQuery({state,open:'0'}); render(); }
  });
  document.addEventListener('keydown', e => {
    if (!['ArrowLeft','ArrowRight'].includes(e.key) || e.target.matches('input,textarea,select,[contenteditable]')) return;
    document.querySelector(`[data-cycle="${e.key==='ArrowLeft'?-1:1}"]`).click();
  });
  render();
</script>
</body>
</html>
